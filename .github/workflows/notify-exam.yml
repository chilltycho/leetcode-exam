name: LeetCode Exam - Notify

# 每天 17:00 北京时间运行，由 exam_tool.py check-day 判断今天是否是考试日
# 考试日可通过 config.json 的 exam_date_override 临时覆盖（score 完成后自动清空）
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 检查今天是否是考试日
        id: check
        run: |
          if python3 exam_tool.py check-day; then
            echo "is_exam_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_exam_day=false" >> $GITHUB_OUTPUT
          fi

      - name: 钉钉通知考试信息（原机器人）
        if: steps.check.outputs.is_exam_day == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 exam_tool.py notify --type problems
