name: LeetCode Exam - Score

# 每天 21:05 北京时间运行，由 exam_tool.py check-day 判断今天是否是考试日
# 考试日可通过 config.json 的 exam_date_override 临时覆盖（score 完成后自动清空）
on:
  schedule:
    - cron: '5 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  score:
    runs-on: ubuntu-latest
    outputs:
      did_run: ${{ steps.check.outputs.is_exam_day }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 检查今天是否是考试日
        id: check
        run: |
          if python3 exam_tool.py check-day; then
            echo "is_exam_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_exam_day=false" >> $GITHUB_OUTPUT
          fi

      - name: 判分（考试当天 AC 判定，不限定窗口）
        if: steps.check.outputs.is_exam_day == 'true'
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        run: python3 exam_tool.py score

      - name: 生成报告（CSV + Markdown）
        if: steps.check.outputs.is_exam_day == 'true'
        run: python3 exam_tool.py report

      - name: 生成网页看板
        if: steps.check.outputs.is_exam_day == 'true'
        run: python3 dashboard/generate_dashboard.py

      - name: 持久化结果与看板（含自动清空的 config.json）
        if: steps.check.outputs.is_exam_day == 'true'
        run: |
          git config user.name "leetcode-exam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f exams.db problems_cache.json reports config.json
          git add dashboard/index.html
          if ! git diff --cached --quiet; then
            git commit -m "exam: 统计 $(TZ=Asia/Shanghai date +%F) 周考成绩并更新看板"
            git push
          else
            echo "无变更，跳过提交"
          fi

      - name: 上传看板到 Pages（使用刚生成的文件）
        if: steps.check.outputs.is_exam_day == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: 钉钉通知成绩
        if: steps.check.outputs.is_exam_day == 'true'
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 exam_tool.py notify --type results

  deploy:
    needs: score
    if: needs.score.outputs.did_run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
