name: LeetCode Exam - Pick

# 每天 09:01 北京时间运行，由 exam_tool.py check-day 判断今天是否是考试日
# 考试日可通过 config.json 的 exam_date_override 临时覆盖（score 完成后自动清空）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install requests

      - name: 检查今天是否是考试日
        id: check
        run: |
          if python3 exam_tool.py check-day; then
            echo "is_exam_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_exam_day=false" >> $GITHUB_OUTPUT
          fi

      - name: 抽取本周考题（2 easy + 2 medium + 1 hard，不与历史重复）
        if: steps.check.outputs.is_exam_day == 'true'
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF: ${{ secrets.LEETCODE_CSRF }}
        run: python3 exam_tool.py pick --date "$(TZ=Asia/Shanghai date +%F)"

      - name: 持久化题库与历史（保证下轮不重复）
        if: steps.check.outputs.is_exam_day == 'true'
        run: |
          git config user.name "leetcode-exam-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f exams.db problems_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "exam: 抽取 $(TZ=Asia/Shanghai date +%F) 周考题"
            git push
          else
            echo "无变更，跳过提交"
          fi

      - name: 钉钉通知考题（提前通知机器人）
        if: steps.check.outputs.is_exam_day == 'true'
        env:
          DINGTALK_EARLY_WEBHOOK: ${{ secrets.DINGTALK_EARLY_WEBHOOK }}
          DINGTALK_EARLY_SECRET: ${{ secrets.DINGTALK_EARLY_SECRET }}
        run: python3 exam_tool.py notify --type problems --robot early
